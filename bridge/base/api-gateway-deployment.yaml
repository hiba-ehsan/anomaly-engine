#! api-gateway-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: api-gateway
    namespace: anomalyengine
    labels:
        com.docker.compose.project: anomalyengine
        com.docker.compose.service: api-gateway
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: anomalyengine
            com.docker.compose.service: api-gateway
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: anomalyengine
                com.docker.compose.service: api-gateway
                com.docker.compose.network.default: "true"
        spec:
            containers:
                - name: api-gateway
                  image: anomalyengine-api-gateway
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: EDGAR_USER_AGENT
                      value: "AnomalyEngine/1.0 (research@anomalyengine.dev)"
                    - name: FINBERT_MODEL
                      value: "ProsusAI/finbert"
                    - name: MODEL_DEVICE
                      value: "cpu"
                  envFrom:
                    - secretRef:
                        name: anomaly-secrets
                  ports:
                    - name: api-gatewa-8000
                      containerPort: 8000
                  volumeMounts:
                    - name: app-packages
                      mountPath: /app/packages
                    - name: app-app
                      mountPath: /app/app
            volumes:
                - name: app-packages
                  hostPath:
                    path: /run/desktop/mnt/host/d/Anomaly Engine\packages
                - name: app-app
                  hostPath:
                    path: /run/desktop/mnt/host/d/Anomaly Engine\services\api-gateway\app
