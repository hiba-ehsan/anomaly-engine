apiVersion: apps/v1
kind: Deployment
metadata:
    name: nlp-engine
    namespace: anomalyengine
    labels:
        com.docker.compose.project: anomalyengine
        com.docker.compose.service: nlp-engine
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: anomalyengine
            com.docker.compose.service: nlp-engine
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: anomalyengine
                com.docker.compose.service: nlp-engine
                com.docker.compose.network.default: "true"
        spec:
            containers:
                - name: nlp-engine
                  image: anomalyengine-nlp-engine
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: EDGAR_USER_AGENT
                      value: "AnomalyEngine/1.0 (research@anomalyengine.dev)"
                    - name: FINBERT_MODEL
                      value: "ProsusAI/finbert"
                    - name: MODEL_DEVICE
                      value: "cpu"
                  envFrom:
                    - secretRef:
                        name: anomaly-secrets
                  ports:
                    - name: nlp-engine-8003
                      containerPort: 8003
                  volumeMounts:
                    - name: app-packages
                      mountPath: /app/packages
                    - name: root--cache-huggingface
                      mountPath: /root/.cache/huggingface
                    - name: app-app
                      mountPath: /app/app
            volumes:
                - name: app-packages
                  hostPath:
                    path: C:\Codes\Anomaly Engine\packages
                - name: root--cache-huggingface
                  persistentVolumeClaim:
                    claimName: nlp-engine-model-cache
                - name: app-app
                  hostPath:
                    path: C:\Codes\Anomaly Engine\services\nlp-engine\app
