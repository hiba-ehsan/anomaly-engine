services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ANOMALY_DATA_DIR=/app/data
      - INGESTION_US_URL=http://ingestion-us:8001
    volumes:
      - ./packages:/app/packages
      - ./data:/app/data:ro

  ingestion-us:
    build: ./services/ingestion-us
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - ANOMALY_DATA_DIR=/app/data
      - SPARK_LOCAL_DIR=/tmp/spark
    volumes:
      - ./packages:/app/packages
      - ./data:/app/data

  ingestion-market:
    build: ./services/ingestion-market
    ports:
      - "8002:8002"
    env_file: .env
    volumes:
      - ./packages:/app/packages

  nlp-engine:
    build: ./services/nlp-engine
    ports:
      - "8003:8003"
    env_file: .env
    volumes:
      - ./packages:/app/packages
      - model-cache:/root/.cache/huggingface

  backtester:
    build: ./services/backtester
    ports:
      - "8004:8004"
    env_file: .env
    depends_on:
      - nlp-engine
    volumes:
      - ./packages:/app/packages

  task-queue:
    build: ./services/task-queue
    env_file: .env
    volumes:
      - ./packages:/app/packages

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api-gateway

volumes:
  model-cache:
